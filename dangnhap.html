<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập Tbook.com</title>
    <link
      rel="stylesheet"
      href="bootstrap-jquery/bootstrap css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/dang_nhap.css" />
    <script src="bootstrap-jquery/jquery-3.7.1.min.js"></script>
    <script src="bootstrap-jquery/bootstrap js/bootstrap.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row row1">
        <div style="margin: 0 auto; width: 80%">
          <div class="col-lg-4 logo">
            <a href="index.html">
              <img src="images/tbook1.png" alt="" />
            </a>
          </div>

          <div class="text_tieu_de">
            <h3>Đăng nhập</h3>
            <p class="text-end"><a href="#">Bạn cần giúp đỡ?</a></p>
          </div>
        </div>
      </div>

      <div class="row row2">
        <div class="row2_con">
          <div class="content_left">
            <div class="content_left_con">
              <h4>TBook</h4>
              <p>&#128737; Nhà sách uy tín hàng đầu Việt Nam</p>
              <p>🌟 Góp phần tạo nên vẻ đẹp tri thức của khách hàng</p>
              <p>👜 Dẫn đầu lượng người mua sắm tại Việt Nam</p>
            </div>
          </div>

          <div class="content_right">
            <form action="" class="form_dang_nhap text-center">
              <h4>Đăng nhập</h4>
              <input
                type="tel"
                id="tai_khoan"
                placeholder="Email/Số điện thoại"
              />
              <i
                class="bi bi-check-circle-fill icon_check1"
                id="icon_check_yes"
              ></i>
              <i class="bi bi-x-circle-fill icon_check1" id="icon_check_no"></i>
              <div class="text-danger text-start" id="tb_tai_khoan"></div>

              <input type="password" id="mat_khau" placeholder="Mật khẩu" />
              <i
                class="bi bi-check-circle-fill icon_check2"
                id="icon_check_yes_mk"
              ></i>
              <i
                class="bi bi-x-circle-fill icon_check2"
                id="icon_check_no_mk"
              ></i>
              <div class="text-danger text-start" id="tb_mat_khau"></div>

              <button
                class="btn btn-secondary btn_tiep_theo"
                id="submit_dang_nhap"
              >
                Đăng nhập
              </button>

              <div class="quen_mk">
                <a href="#">Quên mật khẩu</a>
                <a href="#">Đăng nhập với SMS</a>
              </div>
              <div class="hr">
                <hr />
                <p>Hoặc</p>
                <hr />
              </div>

              <div>
                <button class="btn btn_fb float-start border">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-facebook mb-1 mr-2"
                    viewBox="0 0 16 16"
                    style="color: blue"
                  >
                    <path
                      d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951"
                    />
                  </svg>
                  Facebook
                </button>
                <button class="btn btn_gg float-end border">
                  <div class="img_gg">
                    <img src="images/google_logo.png" alt="" />
                  </div>
                  Google
                </button>
              </div>

              <div class="dang_ky">
                <p>Bạn mới biết TBook? <a href="dangky.html">Đăng ký</a></p>
              </div>
              <div class="clear"></div>
            </form>
          </div>
        </div>

        <div class="clear"></div>
      </div>
    </div>
    <script src="js/dang_nhap.js"></script>
    <script src="js/search.js"></script>
  </body>
</html>
